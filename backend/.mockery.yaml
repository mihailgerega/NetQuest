# Конфигурация mockery v3.
# Документация: https://vektra.github.io/mockery/latest/configuration/

# Шаблон testify с expecter API.
template: testify

# Форматирование сгенерированного кода.
formatter: goimports

# Директория для сгенерированных моков (рядом с интерфейсом в подпапке mocks).
dir: "{{.InterfaceDir}}/mocks"

# Имя файла мока (snake_case через функцию snakecase).
filename: "mock_{{ .InterfaceName | snakecase }}.go"

# Имя пакета моков.
pkgname: "mocks"

# Имя структуры мока (совпадает с именем интерфейса).
structname: "{{.InterfaceName}}"

# Принудительная перезапись существующих файлов.
force-file-write: true

# Boilerplate текст (лицензия, заголовок).
template-data:
  boilerplate-file: ".mockery_boilerplate_text.txt"

packages:
  # API-слой: сервисы, которые зовут хендлеры.
  github.com/netquest/netquest/backend/internal/api/auth/v1:
    config:
      include-interface-regex: "AuthService"
  github.com/netquest/netquest/backend/internal/api/project/v1:
    config:
      include-interface-regex: "ProjectService"
  github.com/netquest/netquest/backend/internal/api/simulation/v1:
    config:
      include-interface-regex: "SimulationService|AccessTokenParser"
  github.com/netquest/netquest/backend/internal/api/auditlog:
    config:
      include-interface-regex: "Recorder"

  # Middleware: проверка access-токена.
  github.com/netquest/netquest/backend/internal/middleware:
    config:
      include-interface-regex: "AccessTokenParser"

  # Сервисный слой: репозитории и доменные сервисы.
  github.com/netquest/netquest/backend/internal/service/application/auth:
    config:
      include-interface-regex: ".*(Repository|Issuer)"
  github.com/netquest/netquest/backend/internal/service/application/project:
    config:
      include-interface-regex: ".*Repository"
  github.com/netquest/netquest/backend/internal/service/application/topology:
    config:
      include-interface-regex: ".*(Repository|Authorizer)"
  github.com/netquest/netquest/backend/internal/service/application/simulation:
    config:
      include-interface-regex: ".*(Repository|Authorizer|Reader|Engine|Producer)"
  github.com/netquest/netquest/backend/internal/service/application/quest:
    config:
      include-interface-regex: ".*(Repository|Checker)"
  github.com/netquest/netquest/backend/internal/service/application/advisor:
    config:
      include-interface-regex: "TopologyReader"

  # Producer: публикация в NATS.
  github.com/netquest/netquest/backend/internal/producer/simulation_event:
    config:
      include-interface-regex: "Publisher"
